[package]
name = "pdq-node-binding"
version = "0.1.0"
description = "Node.js native addon (napi-rs) exposing pdq-core."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pdq-core = { path = "../../crates/pdq-core" }
napi = { version = "3.16", default-features = false, features = ["napi8"] }
napi-derive = "3.7"

[build-dependencies]
napi-build = "2.6"
